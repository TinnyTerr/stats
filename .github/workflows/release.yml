# Builds the standalone binaries and publishes them as a GitHub release
# whenever a v* tag is pushed.
#
#   git tag -a v0.2.0 -m 'v0.2.0' && git push origin v0.2.0
#
# The tag must match `version` in package.json — the build's smoke test checks
# that the binary reports it, and install.sh looks assets up by tag.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bunx biome ci .

      - run: bun run typecheck

      - run: bun test

      # Cross-compiles every target — the six Linux ones plus the Windows and
      # macOS builds from EXTRA_TARGETS — into dist/, alongside gzipped copies,
      # SHA256SUMS and manifest.json. First run downloads a Bun runtime per
      # target (~35 MB each), so this step needs network access.
      - run: bun run build --all

      - name: Write release notes
        run: |
          {
            echo '## Install'
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/TinnyTerr/stats/main/install.sh | sudo sh -s -- --node"
            echo '```'
            echo
            echo 'Windows node (elevated PowerShell):'
            echo
            echo '```powershell'
            echo '$env:STATS_HUB = "ws://hub.lan:3000"; $env:STATS_NODE_TOKEN = "<token>"'
            echo "iwr -useb https://raw.githubusercontent.com/TinnyTerr/stats/main/install.ps1 | iex"
            echo '```'
            echo
            echo "Checksums for every asset are in \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS\`)."
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md
          fi

          # gh release upload has stalled here with no output for 20+ minutes on
          # 80 MB assets, so talk to the API directly: curl gives progress, a
          # stall detector (<10 KB/s for 60s) and a hard cap, and a timeout is
          # an ordinary non-zero exit we can retry.
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"

          shopt -s nullglob
          assets=(
            dist/stats-linux-*
            dist/stats-windows-*
            dist/stats-darwin-*
            dist/SHA256SUMS
            dist/manifest.json
          )

          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            for attempt in 1 2 3; do
              # --clobber: drop any asset of the same name, including the
              # half-finished one a previous attempt left behind.
              gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate \
                --jq ".[] | select(.name == \"$name\") | .id" |
                while read -r old; do
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
                done

              echo "uploading $name ($(du -h "$asset" | cut -f1), attempt $attempt)..."
              if curl --fail-with-body -sS --max-time 600 \
                --speed-limit 10240 --speed-time 60 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$asset" \
                -o /dev/null \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$name"; then
                echo "uploaded $name"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "failed to upload $name after $attempt attempts" >&2
                exit 1
              fi
              echo "upload of $name failed or stalled, retrying..."
              sleep 2
            done
          done
